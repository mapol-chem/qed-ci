[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qed-ci"
version = "0.1.0"
description = "Pauli-Fierz configuration interaction and state-averaged CASSCF with Psi4"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{name = "QED-CI contributors"}]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.60",
    "llvmlite>=0.43",
    "psutil>=5.9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.urls]
Repository = "https://github.com/FoleyLab/qed-ci"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["qed_ci"]
include-package-data = false
py-modules = [
    "helper_PFCI",
    "helper_cqed_rhf",
    "nuclear_grad",
    "mecp_optimizer",
    "gmres",
    "residual_minimization",
    "ortho_script",
    "orbital_sigma",
    "orbital_symmetry",
    "otr_trust_region",
    "lstrs_trust_region",
    "trust_region_solvers",
    "davidson_augmented_hessian",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/tests"]
pythonpath = ["src"]
